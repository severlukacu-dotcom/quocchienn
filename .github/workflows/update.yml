name: Update Repo Metadata

on:
  push:
    paths:
      - 'debs/**'
      - 'build.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Run build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Packages Packages.bz2 Packages.gz Release || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update Packages and Release" && git push)
