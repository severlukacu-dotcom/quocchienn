name: Update Repo Metadata

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Run build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Packages Packages.gz Packages.bz2 Release

          if git diff --cached --quiet
          then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto update Packages and Release"

          git push