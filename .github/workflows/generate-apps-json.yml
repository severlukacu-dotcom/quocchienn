name: Generate apps.json

on:
  push:
    paths:
      - "ipa/**"
      - "generate_apps_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chạy script sinh apps.json
        run: python3 generate_apps_json.py

      - name: Commit apps.json nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: tự động cập nhật apps.json"
          git push