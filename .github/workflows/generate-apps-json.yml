# Đặt file này vào: .github/workflows/generate-files-json.yml
# Tự động chạy generate_files_json.py mỗi khi có thay đổi trong thư mục files/,
# rồi commit lại files.json vào cùng nhánh. Mô tả/type bạn đã viết tay cho các
# file cũ sẽ được giữ nguyên, chỉ file mới mới bị để trống cần điền thêm.

name: Generate files.json

on:
  push:
    paths:
      - "files/**"
      - "generate_files_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chạy script sinh/cập nhật files.json
        run: python3 generate_files_json.py

      - name: Commit files.json nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --cached --quiet || git commit -m "chore: tự động cập nhật files.json"
          git push
