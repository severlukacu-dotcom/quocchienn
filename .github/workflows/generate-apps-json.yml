name: Generate JSON Files

on:
  push:
    paths:
      - "ipa/**"
      - "files/**"
      - "generate_apps_json.py"
      - "generate_files_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate apps.json
        run: python3 generate_apps_json.py

      - name: Generate files.json
        run: python3 generate_files_json.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps.json files.json icons/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
          else
            git commit -m "chore: tự động cập nhật apps.json và files.json"
            git push
          fi